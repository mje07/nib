# nib configuration — copy to ~/.config/nib/config.toml
# Every key is optional. Run nib with `-u NONE` to ignore the config.

# Key used for <leader> in mappings (default: space).
leader = " "

# Colour scheme (switch at runtime with :colorscheme, Tab completes):
#   default (follows your terminal's colours), obsidian, obsidian-light,
#   kanagawa, kanagawa-dragon, kanagawa-lotus, tokyonight, tokyonight-storm,
#   tokyonight-moon, tokyonight-day, catppuccin-mocha, catppuccin-macchiato,
#   catppuccin-frappe, catppuccin-latte, rose-pine, rose-pine-moon,
#   rose-pine-dawn, gruvbox, gruvbox-light, nord, dracula, everforest
# or the name of your own scheme in ~/.config/nib/themes/NAME.toml.
colorscheme = "tokyonight"

[options]
number = true
relativenumber = false
wrap = true             # soft-wrap long lines
linebreak = true        # wrap at word boundaries
wrapwidth = 90          # readable line length: centred column (0 = window edge)
breakindent = true      # wrapped list items and quotes hang under their text
tabstop = 4
shiftwidth = 4
expandtab = true
scrolloff = 3
ignorecase = true
smartcase = true
hlsearch = true
incsearch = true
textwidth = 80          # used by gq / gw
preview = true          # markdown live preview (toggle per window with :preview)
headingscale = true     # real large headings on terminals with kitty text sizing
cursorline = false
timeoutlen = 1000       # ms to wait for a multi-key mapping
splitbelow = false
splitright = false
mouse = true
clipboard = false       # true: unnamed register uses the system clipboard

# Mappings are non-recursive (like nnoremap). Use vim key notation.
[keymaps.normal]
"<leader>w" = ":w<CR>"
"<leader>p" = ":preview<CR>"
"<C-s>" = ":w<CR>"

[keymaps.insert]
"jk" = "<Esc>"

[keymaps.visual]
"<leader>y" = "\"+y"

# Per-group overrides, applied on top of whichever scheme is active.
# fg/bg accept the scheme's palette names ("accent", "h1", "red", "fg_muted", …),
# terminal colour names ("blue", "lightmagenta"), hex ("#ff79c6") or 0-255
# indices; plus bold/italic/underline/dim/reversed/strikethrough.
[theme]
h1 = { fg = "h1", bold = true, underline = true }
link = { fg = "cyan", underline = true }
