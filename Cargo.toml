[package]
name = "nib-editor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nib"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
libc = "0.2.190"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
swash = "0.2.10"
toml = "1.1.8"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
codegen-units = 4
